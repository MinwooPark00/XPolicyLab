# Basic experiment configuration
policy_name: ACT
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
action_type: null
ckpt_setting: null
seed: 0
eval_batch: false

# ACT-specific arguments
kl_weight: 10.0
chunk_size: 50
hidden_dim: 512
dim_feedforward: 3200
temporal_agg: false
device: cuda:0

# DETR parser args
ckpt_dir: null
policy_class: ACT
num_epochs: 6000

# Model training params
position_embedding: sine
lr_backbone: 0.00001
weight_decay: 0.0001
lr: 0.00001
masks: false
dilation: false
backbone: resnet18
nheads: 8
enc_layers: 4
dec_layers: 7
pre_norm: false
dropout: 0.1
# MHBench ignores this list: model.py serves ego_a then ego_b (cam_left_wrist,
# cam_right_wrist), the order its two-camera policies were trained in.
camera_names: ["cam_left_wrist", "cam_right_wrist"]

# --- MHBench (bench_name=mhbench, env_cfg_type=unitree_g1x2_decentralized): ---
# one server drives both robots from two single-robot ACT checkpoints. ckpt_name
# is the task (cocarry/handover); per-robot dirs resolve to
# checkpoints/mhbench-<task>_robot_<r>-unitree_g1x2_decentralized-<action_type>-<seed>.
# Explicit override, same convention as GR00T_N17/deploy.yml's model_dir_<robot>.
# Which per-robot setting a checkpoint is (train.sh ACT_VARIANT: dtde, jointobs,
# jointact) is read off its dataset_stats.pkl; CKPT_TAG names the run directory.
model_dir_robot_a: null
model_dir_robot_b: null
