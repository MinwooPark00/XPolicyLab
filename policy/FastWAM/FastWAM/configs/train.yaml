# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4

# Fine-tuning knobs. Declared here so hydra's struct mode accepts them as
# overrides; the defaults leave full fine-tuning from scratch unchanged.
#   freeze_video_dit: keep the pretrained video world model frozen and train
#     only the action expert (+ proprio encoder).
#   lora_rank > 0:    the alternative -- adapters on the video expert's linear
#     projections, action expert still trained in full. Mutually exclusive with
#     freeze_video_dit.
#   init_weights:     a released .pt to start the weights from, as opposed to
#     `resume`, which continues a run of our own (optimizer, scheduler, step).
freeze_video_dit: false
lora_rank: 0
lora_alpha: 16
lora_dropout: 0.0
init_weights: null

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10
# Validation-loss estimator: how many held-out samples to average and the seed
# that fixes their flow-matching noise. See Wan22Trainer.evaluate -- upstream
# scored one random sample with fresh noise, which is why `eval/val_loss` was
# unreadable as a trend.
eval_num_loss_samples: 32
eval_noise_seed: 12345

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
