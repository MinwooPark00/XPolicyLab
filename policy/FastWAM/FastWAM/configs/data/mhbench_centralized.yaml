# MHBench centralized: one policy driving both Unitree G1 robots.
#
# Two ego views (each robot's own head camera), stacked vertically into one
# 480x320 canvas and resized to the same 384x320 the robotwin pretrain used,
# so the token budget is the known-good one. Action is the 70D slice every
# MHBench baseline trains on ([arms, hands, waist, base height, navigate] x 2,
# scripts/data_convertion.py --format fastwam); state is the 86D joint-angle
# vector (both robots' 43, observation.state order) -- the exact vector the
# eval adapter reassembles from `mhbench_state[*].joint_pos`, which is why
# state here is NOT the robotwin state=action convention.
#
# dataset_dirs / caches / stats are placeholders: policy/FastWAM/train.sh
# overrides them per dataset.
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/mhbench/lerobot
  shape_meta:
    images:
      - key: ego_a
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: ego_b
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 70
        shape: 70
    state:
      - key: default
        raw_shape: 86
        shape: 86
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action steps, 9 video frames
  video_size: [384, 320]
  camera_key: null
  # The benchmark's 50/10 split is fixed (meta/info.json); train and val are
  # separate converted datasets, so nothing is carved off randomly here.
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: ./data/mhbench/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "vertical"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 70
    proprio_output_dim: 86
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/mhbench
  context_len: 128

# shape_meta and processor are spelled out rather than interpolated from
# train, matching robotwin.yaml: train.sh overrides the action/state widths on
# both splits, and hydra cannot reach through `${data.train.shape_meta}` to a
# key that does not exist under data.val ("Key 'action' is not in struct").
val:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/mhbench/lerobot_val
  shape_meta:
    images:
      - key: ego_a
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: ego_b
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 70
        shape: 70
    state:
      - key: default
        raw_shape: 86
        shape: 86
  num_frames: ${data.train.num_frames}
  global_sample_stride: ${data.train.global_sample_stride}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: false
  pretrained_norm_stats: ${data.train.pretrained_norm_stats}
  skip_padding_as_possible: false
  concat_multi_camera: ${data.train.concat_multi_camera}
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.val.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 70
    proprio_output_dim: 86
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
