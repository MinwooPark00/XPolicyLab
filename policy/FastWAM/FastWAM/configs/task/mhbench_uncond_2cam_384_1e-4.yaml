# @package _global_
# MHBench centralized (two ego views on one 384x320 canvas), uncond FastWAM.
# Mirrors robotwin_uncond_3cam_384_1e-4 with the mhbench data config.

defaults:
  - override /data: mhbench_centralized
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 16
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
