# @package _global_
# MHBench decentralized (one ego view, 240x320 native -> 192x320 canvas),
# uncond FastWAM.
# Mirrors robotwin_uncond_3cam_384_1e-4 with the mhbench data config.

defaults:
  - override /data: mhbench_decentralized
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  # true also turns on gradient checkpointing (fastwam.yaml ties them), which
  # is what fits a 5.6B-trainable DiT on 4x48GB with ZeRO-2 -- robotwin ran
  # 64 GPUs and could afford false. Inference never checkpoints, so serving
  # through this yaml is unaffected.
  mot_checkpoint_mixed_attn: true
  # Self-contained on the Wan-AI/Wan2.2-TI2V-5B files (the T5 encoder and VAE
  # ship there as .pth): the DiffSynth-Studio safetensors redirect repo lives
  # on ModelScope, which a compute node cannot reach, and the loader hashes
  # state-dict keys rather than bytes, so the .pth originals load identically.
  redirect_common_files: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 16
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
