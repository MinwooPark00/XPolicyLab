policy_name: GauDP
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
action_type: joint
gpu_id: null
eval_batch: false

# GauDP-specific. The checkpoint's camera_order decides the views; set this
# only to cross-check that the scene camera is (true) or is not (false) one.
use_scene: null
# best falls back to last when best.ckpt does not exist (and vice versa).
checkpoint: last
# Clamp live joint observations to the per-dimension range stored in the policy
# checkpoint. Handover contains nearly constant joints (the narrowest spans only
# ~9e-6 rad), so ordinary simulator drift otherwise becomes an enormous
# normalized condition and destabilizes the closed-loop rollout.
obs_clip: fitted               # fitted | None
# Optional portability override when the policy used an external/official
# NoPoSplat checkpoint rather than gaussian/{best,last}.ckpt.
gaussian_checkpoint: null
