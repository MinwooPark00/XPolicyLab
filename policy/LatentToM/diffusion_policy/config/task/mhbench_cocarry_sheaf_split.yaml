name: mhbench_cocarry_sheaf_split

image_shape: [3, 240, 320]
# process_data.sh's convert_to_replay_buffer.py output directory (holding
# replay_buffer.zarr/ + videos/) -- overridden per run via
# task.dataset_path=..., train.sh derives it from
# <bench_name>-<ckpt_name>-<env_cfg_type>-<action_type>-<rotation_rep>.
# rotation_rep itself ("quat"=22D/arm or "rot6d"=26D/arm, see
# rotation_conversion.py) is baked into the converted data on disk, not read
# by XarmSplitActionDataset -- train.sh overrides arm{1,2}_action.shape below
# to match whichever rotation_rep the data was actually converted with.
dataset_path: ???

shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    camera_3:
      shape: ${task.image_shape}
      type: rgb
    camera_4:
      shape: ${task.image_shape}
      type: rgb
    arm1_proprio:
      shape: [21]  # pelvis pose(7) + left eef pose(7) + right eef pose(7)
      type: low_dim
    arm2_proprio:
      shape: [21]
      type: low_dim
  arm1_action:
    shape: [22]  # 22 for quat, 26 for rot6d -- train.sh overrides this to match the data
  arm2_action:
    shape: [22]

dataset:
  _target_: diffusion_policy.dataset.xarm_split_action_dataset.XarmSplitActionDataset
  # OmegaConf interpolation (live), not a YAML anchor -- a
  # train.sh -C task.shape_meta.arm1_action.shape=[26] override must reach
  # here too, and a YAML anchor/alias copies at parse time, before Hydra CLI
  # overrides apply, so it wouldn't.
  shape_meta: ${task.shape_meta}
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
