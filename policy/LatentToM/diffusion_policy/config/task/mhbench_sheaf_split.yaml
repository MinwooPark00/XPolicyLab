# Every MHBench two-G1 task presents the same thing to this policy: three
# cameras at 240x320, 43D proprio per robot, 35D action per robot. Nothing in
# here was ever cocarry-specific except the word in the filename, which made
# `task=mhbench_cocarry_sheaf_split` a hardcoded line in train.sh and the other
# three tasks unreachable. Which scene a run is on is carried by
# `task.dataset_path` and the run directory, both of which train.sh derives from
# `env_cfg_type`.
name: mhbench_sheaf_split

image_shape: [3, 240, 320]
# process_data.sh's convert_to_replay_buffer.py output directory (holding
# replay_buffer.zarr/ + videos/) -- overridden per run via
# task.dataset_path=..., train.sh derives it from
# <bench_name>-<ckpt_name>-<env_cfg_type>-<action_type>.
dataset_path: ???

shape_meta:
  # acceptable types: rgb, low_dim
  obs:
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    camera_3:
      shape: ${task.image_shape}
      type: rgb
    camera_4:
      shape: ${task.image_shape}
      type: rgb
    arm1_proprio:
      shape: [43]  # 7 URDF joint groups (configs/gr00t/mhbench_keys.py's JOINT_GROUPS): legs+waist+arms+hands
      type: low_dim
    arm2_proprio:
      shape: [43]
      type: low_dim
  arm1_action:
    shape: [35]  # GR00T's own action contract (mhbench_keys.py):
                 # joint targets(31: left_arm 7, right_arm 7, left_hand 7,
                 # right_hand 7, waist 3) + base_height(1) + navigate_command(3)
  arm2_action:
    shape: [35]

dataset:
  _target_: diffusion_policy.dataset.xarm_split_action_dataset.XarmSplitActionDataset
  # OmegaConf interpolation (live), not a YAML anchor -- a Hydra CLI override
  # to task.shape_meta must reach here too, and a YAML anchor/alias copies at
  # parse time, before CLI overrides apply, so it wouldn't.
  shape_meta: ${task.shape_meta}
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
