# Basic experiment configuration
policy_name: DreamZero
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
action_type: null
action_dim: null
seed: null
eval_batch: false

# MHBench serving (bench_name=mhbench, centralized only): the run directory
# resolves through model_path/checkpoint roots as elsewhere; checkpoint_num
# is unused (HF checkpoint-N dirs resolve to the newest). allow_dummy_policy
# serves zero actions for the GPU-less wiring check.
mhbench_mode: null
# What `decentralized` means here: `shared` is the benchmark's default -- one
# multitask policy drives both robots, told apart only by the instruction each
# agent is given. `per_robot` is the older pair, one checkpoint per (task,
# robot). eval_policy.sbatch overrides this from the serving hook
# (MHBENCH_DECENTRALIZED_STYLE); it is spelled out here so a server started
# from this file alone serves what the benchmark means.
mhbench_decentralized_style: shared
model_dir: null
ckpt_tag: null
checkpoint_num: null
allow_dummy_policy: false

# DreamZero-specific parameters
model_path: null
pretrained_model_path: null
tokenizer_path: null
action_horizon: 24
video_history: 4
ctrl_freq: 30
prompt: null
inference_method: lazy_joint_forward_causal # forward, lazy_joint_forward, lazy_joint_forward_causal
skip_img_transform: false
native_dojo_action: false
