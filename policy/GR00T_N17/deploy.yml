# Basic experiment configuration
policy_name: GR00T_N17
protocol: ws
host: localhost
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
gpu_id: null
eval_batch: false

# Model / checkpoint configuration (local paths relative to policy/GR00T_N17/)
action_type: joint
embodiment_tag: NEW_EMBODIMENT
# decentralized = the shared multitask policy driving both robots (the default;
# see mhbench_decentralized_style below), or the older pair of per-robot
# checkpoints in one server; centralized = the single policy emitting both
# arms' action. model_dir overrides the shared and centralized run directory,
# model_dir_robot_a/_robot_b the per-robot pair's.
mhbench_mode: decentralized
# What `decentralized` means here: `shared` is the benchmark's default -- one
# multitask policy drives both robots, told apart only by the instruction each
# agent is given. `per_robot` is the older pair, one checkpoint per (task,
# robot). eval_policy.sbatch overrides this from the serving hook
# (MHBENCH_DECENTRALIZED_STYLE); it is spelled out here so a server started
# from this file alone serves what the benchmark means.
mhbench_decentralized_style: shared
# Suffix train.sh gave the run directory (CKPT_TAG): full, scene, ...
ckpt_tag: null
# Finetuned step under checkpoints/<ckpt_name>/; null = auto-resolve + checkpoint_num
checkpoint_num: last
model_dir: null
# Cosmos backbone for processor; HuggingFace repo id (auto-download) or relative local path
cosmos_model_path: shared/Cosmos-Reason2-2B
default_prompt: Perform the robot manipulation task.

# Debug blocker (192.168.156.48): gr00t_n17/.venv not installed; run install.sh first.
# uv environment for policy server (use eval.sh policy_conda_env=uv)
policy_uv_env_path: gr00t_n17

port: 6000

# --- MHBench (bench_name=mhbench): one server drives both decentralized robots ---
# ckpt_name is the task (cocarry/handover/...), or `multitask` for the shared
# decentralized policy; per-robot merged model dirs resolve to
# checkpoints/mhbench-<task>_robot_<r>-unitree_g1x2_decentralized-joint-<seed>/<same>/merged-<step>.
merged_checkpoint: last
exec_horizon: 40
model_dir_robot_a: null
model_dir_robot_b: null
prompt_robot_a: null
prompt_robot_b: null
